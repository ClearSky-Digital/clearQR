# ClearQR web app: the released image, served by nginx on port 8080 inside the container, at the root of its own address (clearqr.app).
#
# Portainer: Stacks > Add stack > Web editor, paste this file, deploy. To move to a newer release, set CLEARQR_TAG
# (default 1.1.0) under "Environment variables" and "Update the stack".
#
# Reverse proxy: no host port is published. The container joins the existing external Docker network that the
# proxy is on (default name publictools; set PROXY_NETWORK to change it), and the proxy forwards to clearqr:8080.
# With Nginx Proxy Manager: add a proxy host for the domain (scheme http, forward hostname clearqr-app, port 8080) and
# turn on TLS. No location block is needed.
#
# The released image serves the app at the root. For a subpath, build your own image from this repository
# with --build-arg CLEARQR_BASE_PATH=/your-path.
services:
  clearqr:
    image: ghcr.io/clearsky-digital/clearqr:${CLEARQR_TAG:-1.1.0}
    container_name: clearqr-app
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK:-publictools}
    external: true
