# Served inside the container on port 8080. __BASE__ is replaced at build time with the app's subpath.
# The headers follow the README's "Hosting headers" section: the page's own policy plus frame-ancestors.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok
";
    }

    # subpath-start
    location = / {
        return 302 __BASE__/;
    }

    location = __BASE__ {
        return 301 __BASE__/$is_args$args;
    }

    # The subpath in any other capitalization (for example /ClearQR/...) redirects to the exact one.
    location ~* ^__BASE__(?:/(?<rest>.*))?$ {
        return 301 __BASE__/$rest$is_args$args;
    }
    # subpath-end

    location ^~ __BASE__/_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ __BASE__/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 __BASE__/404.html;
}
