# Redirect-only mode: every request gets a permanent redirect to the same path on the new address.
# __TARGET__ is the new site's address (no trailing slash). __BASE__ is the old subpath, which is dropped.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # subpath-start
    location = __BASE__ {
        return 301 __TARGET__/$is_args$args;
    }

    location ~* ^__BASE__(?<rest>/.*)$ {
        return 301 __TARGET__$rest$is_args$args;
    }
    # subpath-end

    location / {
        return 301 __TARGET__$request_uri;
    }
}
